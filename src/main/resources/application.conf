ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ net.kigawa.kaft.ApplicationKt.module ]
    }
}

kaft {
    storage {
        path = "/tmp/kaft-storage"
        path = ${?KAFT_STORAGE_PATH}
    }
    jwt {
        secret = "change-this-secret-in-production"
        secret = ${?KAFT_JWT_SECRET}
        issuer = "kaft"
        issuer = ${?KAFT_JWT_ISSUER}
        expirationSeconds = 3600
        expirationSeconds = ${?KAFT_JWT_EXPIRATION_SECONDS}
    }
    internal {
        jwtSecret = "change-this-internal-secret-in-production"
        jwtSecret = ${?KAFT_INTERNAL_JWT_SECRET}
    }
}
