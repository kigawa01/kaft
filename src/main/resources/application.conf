ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ net.kigawa.kaft.ApplicationKt.module ]
    }
}

kaft {
    storage {
        backend = "local"
        backend = ${?KAFT_STORAGE_BACKEND}
        path = "/tmp/kaft-storage"
        path = ${?KAFT_STORAGE_PATH}
        r2 {
            accountId = ""
            accountId = ${?KAFT_STORAGE_R2_ACCOUNT_ID}
            bucket = ""
            bucket = ${?KAFT_STORAGE_R2_BUCKET}
            accessKeyId = ""
            accessKeyId = ${?KAFT_STORAGE_R2_ACCESS_KEY_ID}
            secretAccessKey = ""
            secretAccessKey = ${?KAFT_STORAGE_R2_SECRET_ACCESS_KEY}
        }
    }
    jwt {
        secret = "change-this-secret-in-production"
        secret = ${?KAFT_JWT_SECRET}
        issuer = "kaft"
        issuer = ${?KAFT_JWT_ISSUER}
        expirationSeconds = 3600
        expirationSeconds = ${?KAFT_JWT_EXPIRATION_SECONDS}
    }
    internal {
        jwtSecret = "change-this-internal-secret-in-production"
        jwtSecret = ${?KAFT_INTERNAL_JWT_SECRET}
    }
}
