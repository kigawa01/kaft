name: Deploy (stg)

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'k8s/**'

concurrency:
  group: kaft-deploy-stg
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: ./gradlew build --console=plain

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get secrets from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            929d361e-e599-4b58-b173-b3e201004d0a > HARBOR_USERNAME
            13c66d3b-7eb6-4c37-b466-b3e2010057b1 > HARBOR_PASSWORD

      - uses: docker/login-action@v4
        with:
          registry: harbor.kigawa.net
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: harbor.kigawa.net/private/kaft:stg-${{ github.sha }}

  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop

      - name: Update stg image tag
        run: |
          sed -i "s|image: harbor.kigawa.net/private/kaft:.*|image: harbor.kigawa.net/private/kaft:stg-${{ github.sha }}|" k8s/stg/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/stg/deployment.yaml
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "deploy: kaft stg ${{ github.sha }}"
          git push
