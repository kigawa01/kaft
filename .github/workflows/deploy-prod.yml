name: Deploy (prod, manual promote from stg)

on:
  workflow_dispatch:

concurrency:
  group: kaft-deploy-prod
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  promote-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop

      - name: Promote current stg image tag to prod
        run: |
          set -euo pipefail
          IMAGE=$(grep -oP '(?<=image: )\S+' k8s/stg/deployment.yaml)
          echo "Promoting: $IMAGE"
          sed -i "s|image: harbor.kigawa.net/private/kaft:.*|image: $IMAGE|" k8s/main/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/main/deployment.yaml
          if git diff --cached --quiet; then
            echo "no changes (prod already matches current stg)"
            exit 0
          fi
          git commit -m "deploy: kaft prod (promote from stg) by ${{ github.actor }}"
          git push

# stgで既にテスト済みのイメージをそのままprodへコピーするだけで、再ビルドは行わない。
